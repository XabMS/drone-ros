# Parámetros de mission_manager (hito S2). Los directorios se sobrescriben desde el launch.
mission_manager:
  ros__parameters:
    acceptance_radius_m: 3.0     # llegada a un punto: distancia horizontal
    alt_tolerance_m: 2.0         # llegada a un punto: error de altura
    arming_timeout_s: 10.0
    takeoff_timeout_s: 60.0
    leg_speed_mps: 3.0           # velocidad conservadora para el tiempo máximo de cada tramo
    leg_timeout_margin_s: 30.0
    drop_wait_s: 5.0             # S2: suelta simulada
    command_resend_s: 5.0        # ARM, TAKEOFF y RTL
    mode_grace_s: 3.0
    setpoint_tolerance_m: 5.0    # consigna de PX4 = objetivo
    setpoint_alt_tolerance_m: 3.0
    setpoint_mismatch_s: 1.0     # consigna cambiada más de esto = intervención externa (AR-017)
    goto_attempts: 3
    status_timeout_s: 1.0
